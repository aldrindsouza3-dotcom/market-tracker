name: NSE reachability test
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Probe NSE and BSE from Actions
        run: |
          python - <<'PY'
          import requests, datetime as dt, zipfile, io
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
             "Accept":"*/*","Accept-Language":"en-US,en;q=0.9","Referer":"https://www.nseindia.com/"}
          s=requests.Session(); s.headers.update(H)
          # warm up cookies
          try: s.get("https://www.nseindia.com", timeout=20)
          except Exception as e: print("warmup err", str(e)[:80])
          try:
              r=s.get("https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv", timeout=30)
              print("NSE EQUITY_L:", r.status_code, len(r.content))
          except Exception as e: print("NSE EQUITY_L ERR", str(e)[:120])
          for back in range(1,7):
              d=dt.date.today()-dt.timedelta(days=back)
              if d.weekday()>=5: continue
              u=f"https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_{d:%Y%m%d}_F_0000.csv.zip"
              try:
                  r=s.get(u, timeout=30); print(f"NSE UDiFF {d}:", r.status_code, len(r.content))
                  if r.status_code==200: break
              except Exception as e: print(f"NSE UDiFF {d} ERR", str(e)[:120])
          # BSE bhavcopy fallback
          for back in range(1,7):
              d=dt.date.today()-dt.timedelta(days=back)
              if d.weekday()>=5: continue
              u=f"https://www.bseindia.com/download/BhavCopy/Equity/BhavCopy_BSE_CM_0_0_0_{d:%Y%m%d}_F_0000.CSV"
              try:
                  r=s.get(u, headers={**H,"Referer":"https://www.bseindia.com/"}, timeout=30); print(f"BSE {d}:", r.status_code, len(r.content))
                  if r.status_code==200: break
              except Exception as e: print(f"BSE {d} ERR", str(e)[:120])
          PY
