name: Daily market run
on:
  schedule:
    # Morning "market open" — several backup times (GitHub cron can be late/skipped); the job only emails once per slot.
    - cron: "45 3 * * 1-5"    # 09:15 IST
    - cron: "10 4 * * 1-5"    # 09:40 IST (backup)
    - cron: "40 4 * * 1-5"    # 10:10 IST (backup)
    # Evening "market closed"
    - cron: "30 11 * * 1-5"   # 17:00 IST
    - cron: "0 12 * * 1-5"    # 17:30 IST (backup)
    - cron: "30 12 * * 1-5"   # 18:00 IST (backup)
  workflow_dispatch:
    inputs:
      force:
        description: "Send notification even if this slot was already sent today (test)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Restore market-data cache (bhavcopies, history)
        uses: actions/cache@v4
        with:
          path: cache
          key: mktcache-${{ github.run_id }}
          restore-keys: mktcache-
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_PHONE: ${{ secrets.GREENAPI_PHONE }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          # Email disabled on purpose (was filling the Sent folder). To re-enable, add SMTP_* back here.
        run: python pipeline/run_daily.py ${{ inputs.force && '--force-notify' || '' }}
      - name: Commit data (keeps track record between runs)
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add site/data; git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"; git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
