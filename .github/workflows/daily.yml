name: Daily market run
on:
  schedule:
    # Times are UTC; IST = UTC+5:30. GitHub's free cron is best-effort and often drops/delays runs, so we
    # fire MANY attempts across each delivery window. The job notifies at most once per slot (dedup) and only
    # inside its IST window (10:00-14:00 morning / 16:00-21:00 evening), so extra fires are cheap no-ops.
    # Midday "market open" push ~11 AM IST — spread 10:45-13:00 IST so at least one attempt lands.
    - cron: "15 5 * * 1-5"    # 10:45 IST
    - cron: "40 5 * * 1-5"    # 11:10 IST
    - cron: "10 6 * * 1-5"    # 11:40 IST
    - cron: "45 6 * * 1-5"    # 12:15 IST
    - cron: "30 7 * * 1-5"    # 13:00 IST
    # Evening "market closed" push ~7-8 PM IST, after NSE publishes TODAY's close (~6:30-7 PM); won't send
    # until today's close data is in. Spread 18:45-20:45 IST.
    - cron: "15 13 * * 1-5"   # 18:45 IST
    - cron: "40 13 * * 1-5"   # 19:10 IST
    - cron: "10 14 * * 1-5"   # 19:40 IST
    - cron: "45 14 * * 1-5"   # 20:15 IST
    - cron: "15 15 * * 1-5"   # 20:45 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Send notification even if this slot was already sent today (test)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Restore market-data cache (bhavcopies, history)
        uses: actions/cache@v4
        with:
          path: cache
          key: mktcache-${{ github.run_id }}
          restore-keys: mktcache-
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREENAPI_ID_INSTANCE: ${{ secrets.GREENAPI_ID_INSTANCE }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          GREENAPI_PHONE: ${{ secrets.GREENAPI_PHONE }}
          GREENAPI_CHAT_ID: ${{ secrets.GREENAPI_CHAT_ID }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          # Email disabled on purpose (was filling the Sent folder). To re-enable, add SMTP_* back here.
        run: python pipeline/run_daily.py ${{ inputs.force && '--force-notify' || '' }}
      - name: Commit data (keeps track record between runs)
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add site/data; git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"; git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
