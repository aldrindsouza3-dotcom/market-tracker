name: Intraday prices
on:
  schedule:
    - cron: "*/30 3-10 * * 1-5"   # every 30 min, ~08:30-16:00 IST weekdays (covers 09:15-15:30)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: intraday, cancel-in-progress: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install yfinance pandas
      - run: python pipeline/intraday.py
      - name: Commit live prices
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add site/data/live.json
          git diff --cached --quiet || git commit -m "Intraday prices $(date -u +%FT%H:%MZ)"
          git pull --rebase -X ours origin main || true
          git push || true
